name: Bug / fallo
description: Algo no funciona como debería
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. Incluye la versión que aparece en el pie de la app.
  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: v1.3.0
    validations:
      required: true
  - type: dropdown
    id: web
    attributes:
      label: Web
      options:
        - Bershka
        - Zara
        - Pull&Bear
        - Stradivarius
        - Oysho
        - Massimo Dutti
        - Otra / no aplica
  - type: textarea
    id: what
    attributes:
      label: Qué pasó
      description: Pasos, resultado esperado y resultado real.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Fragmento del log
      description: Copia las últimas líneas de logs\monitor-*.log (sin datos personales).
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Comprobaciones
      options:
        - label: He probado con la última versión
        - label: He revisado que Edge está instalado
