name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests
        run: dotnet test tests/InditexStockAlarm.Tests/InditexStockAlarm.Tests.csproj -c Release

      - name: Publicar portable autocontenido
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o release

      - uses: actions/upload-artifact@v4
        with:
          name: InditexStockAlarm-win-x64
          path: release/InditexStockAlarm.exe

      - name: Crear Release (solo con tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/InditexStockAlarm.exe
          generate_release_notes: true
